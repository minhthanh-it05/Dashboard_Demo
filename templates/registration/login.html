{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h1 class="h5 mb-3">Đăng nhập</h1>
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Tên đăng nhập hoặc mật khẩu chưa đúng. Vui lòng thử lại.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Tên đăng nhập</label>
            <input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Mật khẩu</label>
            <input class="form-control" type="password" id="id_password" name="password" autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
