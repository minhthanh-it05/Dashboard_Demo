{% load ui %}
{% if is_paginated %}
<nav class="mt-3" aria-label="Phân trang">
  <ul class="pagination pagination-sm">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% query_with page=page_obj.previous_page_number %}">Trước</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% query_with page=page_obj.next_page_number %}">Sau</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
